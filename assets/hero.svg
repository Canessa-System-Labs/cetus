<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Cetus: The evolving cognitive agent. Turns intent, fragmented information and complex requirements into structured work and evidence-backed outcomes, with decisions traceable and authority explicit.">
<title>Cetus: The evolving cognitive agent. Turns intent, fragmented information and complex requirements into structured work and evidence-backed outcomes, with decisions traceable and authority explicit.</title>
<style>.mk-cetus .mk-o1{stop-color:#16D3C7}.mk-cetus .mk-o2{stop-color:#CFE3F3}.mk-cetus .mk-o3{stop-color:#F5F8FB}.mk-cetus .mk-c{fill:#F5F8FB}.mk-cetus .mk-dash{stroke:#D9EAF9}.mk-cetus .mk-lens{fill:#F6FAFF}.mk-cetus .mk-n3{fill:#D9EAF9}.up{opacity:0;animation:up .8s ease-out forwards}.u1{animation-delay:.2s}.u2{animation-delay:.45s}.u3{animation-delay:.7s}.u4{animation-delay:.95s}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.halo{transform-origin:950px 230px;animation:halo 5s ease-in-out infinite}@keyframes halo{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.75;transform:scale(1.04)}}.mk{opacity:0;transform-origin:950px 230px;animation:mk 1.2s .3s cubic-bezier(.2,.9,.3,1.2) forwards,float 7s 1.5s ease-in-out infinite}@keyframes mk{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.ring{transform-origin:950px 230px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1f24"/><stop offset="1" stop-color="#101114"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a3b1c2" stop-opacity=".45"/><stop offset="1" stop-color="#a3b1c2" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="460" rx="28" fill="url(#bg)"/>
<rect width="1200" height="460" rx="28" fill="url(#glow)"/>
<rect width="1200" height="460" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="459" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<g class="up u1"><text x="72" y="120" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#a3b1c2" text-anchor="start" letter-spacing="3">THE EVOLVING COGNITIVE AGENT</text></g><g class="up u2"><text x="70" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-3">Cetus</text></g><g class="up u3"><rect x="74" y="236" width="140" height="4" rx="2" fill="#a3b1c2"/></g><g class="up u4"><text x="72" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">Turns intent, fragmented information and complex</text></g><g class="up u4"><text x="72" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">requirements into structured work and</text></g><g class="up u4"><text x="72" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">evidence-backed outcomes, with decisions traceable</text></g><g class="up u4"><text x="72" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">and authority explicit.</text></g><circle class="halo" cx="950" cy="230" r="190" fill="url(#aura)"/><circle class="ring" cx="950" cy="230" r="170" fill="none" stroke="rgba(255,255,255,0.13)" stroke-dasharray="2 10"/><g class="mk"><svg x="830" y="110" width="240" height="240" color="#a3b1c2" viewBox="150 150 724 724" fill="none" class="mk-cetus"><defs><linearGradient id="cetusOrbit" x1="172" y1="172" x2="852" y2="852" gradientUnits="userSpaceOnUse"><stop class="mk-o1" offset="0"/><stop class="mk-o2" offset=".45"/><stop class="mk-o3" offset="1"/></linearGradient><linearGradient id="cetusLens" x1="488" y1="400" x2="712" y2="624" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A7D7FF"/><stop offset="1" stop-color="#16D3C7"/></linearGradient></defs><circle cx="512" cy="512" r="340" stroke="url(#cetusOrbit)" stroke-width="32"/><circle class="mk-dash" cx="512" cy="512" r="292" stroke-width="6" stroke-dasharray="6 26" stroke-linecap="round"/><path class="mk-c" d="M679.125 312.828A260 260 0 1 0 679.125 711.172L627.702 649.888A180 180 0 1 1 627.702 374.112Z"/><path d="M646 512C698 478 754 480 804 444C780 495 780 547 804 598C752 568 698 566 646 512Z" fill="#16D3C7" fill-opacity=".22"/><circle class="mk-lens" cx="600" cy="512" r="104" stroke="url(#cetusLens)" stroke-width="24"/><circle cx="600" cy="512" r="44" fill="#16D3C7"/><circle cx="512" cy="172" r="16" fill="#16D3C7"/><circle cx="852" cy="512" r="16" fill="#A7D7FF"/><circle class="mk-n3" cx="512" cy="852" r="16"/></svg></g>
</svg>
