<text x="64" y="96" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#a3b1c2" text-anchor="start" letter-spacing="3">THE FULL STORY</text><text x="64" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1.2">Intent in. Evidence out.</text><text x="64" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">Chapters, motion, voice and film: Cetus as it is meant to be seen.</text><g class="cta"><rect x="64" y="222" width="331" height="46" rx="23" fill="url(#acc2)"/><text x="84" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c0d10" text-anchor="start" letter-spacing="0">See Cetus on canessasyslabs.com</text></g>
