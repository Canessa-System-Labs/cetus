<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="05 Where it stands. Honest status, enforced by the build">
<title>05 Where it stands. Honest status, enforced by the build</title>
<style>.ln{transform-origin:64px 0;transform:scaleX(0);animation:ln 1.2s .2s ease-out forwards}@keyframes ln{to{transform:scaleX(1)}}.in{opacity:0;animation:in .8s ease-out forwards}.i2{animation-delay:.25s}@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}.dot{animation:d 2.4s ease-in-out infinite}@keyframes d{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2125"/><stop offset="1" stop-color="#18191c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  
</defs>
<rect width="1200" height="150" rx="28" fill="url(#bg)"/>
<rect width="1200" height="150" rx="28" fill="url(#glow)"/>
<rect width="1200" height="150" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="149" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<g class="in"><text x="64" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="3">05</text></g><circle class="dot" cx="104" cy="57" r="4" fill="#2dd4bf"/><g class="in i2"><text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1">Where it stands</text></g><text x="1136" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7d8ba1" text-anchor="end" letter-spacing="0">Honest status, enforced by the build</text><rect class="ln" x="64" y="124" width="1072" height="2" rx="1" fill="url(#accent)"/>
</svg>
